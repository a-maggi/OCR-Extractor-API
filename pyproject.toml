[project]
name = "ocr-extractor-api"
version = "0.2.0"
description = "Internal OCR extraction service: queued Marker 2.0 conversions, text layer first"
authors = [{ name = "Agustin Maggi" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "marker-pdf==2.0.0",
    "torch>=2.7.0,<3",
    "torchvision>=0.22.0,<1",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.32.0,<1",
    "httpx>=0.27.0,<1",
    "pydantic-settings>=2.4.0,<3",
    "pypdfium2>=5.10.1,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<2",
]

# CPU-only PyTorch: the default PyPI wheels bundle CUDA (several GB we never use)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
