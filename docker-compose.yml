services:
  ocr-extractor:
    build: .
    ports:
      - "8001:8000"
    volumes:
      - ./src:/app/src
    command: poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - CUDA_LAUNCH_BLOCKING=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]